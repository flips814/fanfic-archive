x-app: &app
  build: .
  image: fanfic-archive:latest
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fanfic}:${POSTGRES_PASSWORD:-fanfic}@db:5432/${POSTGRES_DB:-fanfic}
    FANFICFARE_PERSONAL_INI: /config/personal.ini
  volumes:
    - ./config:/config:ro
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fanfic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fanfic}
      POSTGRES_DB: ${POSTGRES_DB:-fanfic}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    <<: *app
    ports:
      - "${WEB_PORT:-8000}:8000"

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true

  # Solves Cloudflare challenges for FanFiction.net / FictionPress.
  # Enabled by COMPOSE_PROFILES=flaresolverr + FLARESOLVERR_URL in .env (see .env.example).
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    profiles: ["flaresolverr"]
    environment:
      LOG_LEVEL: info

volumes:
  pgdata:
