# Everything the archive needs, started together with:  docker compose up -d --build
#   db            PostgreSQL (data in the "pgdata" volume)
#   web           the website on http://localhost:${WEB_PORT:-8000}
#   worker        imports works and checks for new chapters in the background
#   flaresolverr  gets past Cloudflare on FanFiction.net / FictionPress
#   libretranslate  open-source machine translation for the reader's "Translate" button
name: fanfic-archive

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build: .
  image: fanfic-archive:latest
  restart: unless-stopped
  logging: *logging
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fanfic}:${POSTGRES_PASSWORD:-fanfic}@db:5432/${POSTGRES_DB:-fanfic}
    FANFICFARE_PERSONAL_INI: /config/personal.ini
    # Set FLARESOLVERR_URL= (empty) in .env to stop using FlareSolverr.
    FLARESOLVERR_URL: ${FLARESOLVERR_URL-http://flaresolverr:8191}
    # Set TRANSLATE_URL= (empty) in .env to turn translation off.
    TRANSLATE_URL: ${TRANSLATE_URL-http://libretranslate:5000}
  volumes:
    - ./config:/config:ro
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fanfic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fanfic}
      POSTGRES_DB: ${POSTGRES_DB:-fanfic}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    <<: *app
    ports:
      - "${WEB_PORT:-8000}:8000"
    # health check: /healthz (defined in the Dockerfile)

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
      flaresolverr:
        condition: service_started
        required: false
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "worker"]
      interval: 60s
      timeout: 15s
      start_period: 90s
      retries: 3

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    logging: *logging
    environment:
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8191/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3

  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    logging: *logging
    environment:
      # Languages to download and offer (English is always needed). Each one costs disk space and
      # memory; the first start downloads them, which can take several minutes.
      LT_LOAD_ONLY: ${TRANSLATE_LANGUAGES:-en,es,fr,de,it,pt,ru,zh,ja,ko,pl,nl,id,tr,uk,vi}
      # Download languages added to the list above on the next start (skipped when offline).
      LT_UPDATE_MODELS: "true"
      LT_DISABLE_WEB_UI: "true"
    volumes:
      - translate-models:/home/libretranslate/.local
    healthcheck:
      test: ["CMD", "./venv/bin/python", "scripts/healthcheck.py"]
      interval: 60s
      timeout: 10s
      start_period: 15m
      retries: 3

volumes:
  pgdata:
  translate-models:
